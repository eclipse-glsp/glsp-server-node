packages:
    - 'packages/*'
    - 'examples/*'

# Tooling (eslint, prettier, vitest, rimraf, @eclipse-glsp/*-config, ...) is provided
# as transitive deps of @eclipse-glsp/dev and must resolve from the workspace root
# (tsconfig `extends`, lint/test/build bins). Public-hoist only the dev tooling; app/runtime
# deps stay strictly isolated. pnpm >=11 no longer reads non-auth settings from .npmrc, so
# this lives here.
publicHoistPattern:
    - '@eclipse-glsp/*config*'
    - '@eclipse-glsp/cli'
    - 'eslint'
    - 'eslint-*'
    - '@typescript-eslint/*'
    - 'prettier'
    - 'prettier-plugin-*'
    - 'vitest'
    - '@vitest/*'
    - 'rimraf'
    - '@types/*' # type stubs are compile-time-only; hoist so `@types/<x>` resolves at root

# Force-resolve vulnerable transitive deps to patched versions (pnpm audit advisories).
# All are minimum floors (>=), not forced downgrades — they only lift transitives that
# resolve below the patched range.
overrides:
    # serialize-javascript XSS (GHSA-5c6j-r48x-rmvq high, GHSA-qj8w-gfj5-8c6v moderate)
    serialize-javascript: '>=7.0.5'
    # js-yaml special-char handling (GHSA-h67p-54hq-rp68); pulled via nyc>load-nyc-config
    js-yaml: '>=4.1.2'
    # jsdiff ReDoS (GHSA-73rr-hh4g-fpgx); pulled by mocha (declares ^7, fix is in >=8.0.3)
    diff: '>=8.0.3'

# Deps allowed to run install/build scripts (pnpm >=11 replaces onlyBuiltDependencies).
# Adjust per repo — inspect what native/postinstall deps the repo actually uses.
allowBuilds:
    esbuild: true
    unrs-resolver: true

# Min age (minutes) of dependency versions to install — supply-chain hardening. 4320 = 72h.
minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
# First-party packages are consumed as fresh nightlies (next tag), not a supply-chain risk —
# exempt them from the age gate. Add `@eclipse-glsp-examples/*` (note the separate scope —
# `@eclipse-glsp/*` does NOT match it) when the repo consumes example packages as `next`.
minimumReleaseAgeExclude:
    - '@eclipse-glsp/*'
    - '@eclipse-glsp-examples/*'
